name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main, modernize]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx tsc --noEmit

      # tests/globalSetup.js spins up its own in-memory mongod and sets
      # JWT_SECRET/DATABASE itself - no service container or secrets needed.
      - run: npm test
